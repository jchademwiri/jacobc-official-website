name: CI Validation
on:
  push:
    branches-ignore: [master, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build Check
        run: bun run build
      # Optional: Add linting here just like in Apex
      - name: Lint Check
        run: bun run lint