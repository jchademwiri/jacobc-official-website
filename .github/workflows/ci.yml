name: CI Validation
on:
  push:
    branches-ignore: [master, main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install
      
      - name: Build Check
        run: bun run build
      
      - name: Lint Check
        run: bun run lint