<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9184d9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="150" cy="150" r="220" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="260" fill="#9184d9" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Main Dashboard Container / Window -->
  <g filter="url(#shadow)">
    <rect x="75" y="45" width="1050" height="585" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect x="75" y="45" width="1050" height="48" rx="16" fill="#1f2937"/>
    <rect x="75" y="77" width="1050" height="16" fill="#1f2937"/>
    <line x1="75" y1="93" x2="1125" y2="93" stroke="#374151" stroke-width="1"/>

    <!-- Window Buttons -->
    <circle cx="105" cy="69" r="6" fill="#ef4444"/>
    <circle cx="125" cy="69" r="6" fill="#f59e0b"/>
    <circle cx="145" cy="69" r="6" fill="#10b981"/>

    <!-- Browser Pill -->
    <rect x="360" y="57" width="480" height="24" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="600" y="73" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="middle">fleet.tshwane-water.co.za / dispatch-telemetry</text>

    <!-- Header Section -->
    <g transform="translate(105, 115)">
      <text x="0" y="24" fill="#38bdf8" font-family="monospace" font-size="12" letter-spacing="2" font-weight="600">CITY OF TSHWANE — HUMAN SETTLEMENTS</text>
      <text x="0" y="54" fill="#f3f4f6" font-family="sans-serif" font-size="22" font-weight="700">Potable Water Tanker Fleet Logistics</text>
      <text x="0" y="78" fill="#9ca3af" font-family="sans-serif" font-size="13">8-Truck Daily Distribution · Informal Settlements Supply Contract (2025–2028)</text>

      <g transform="translate(810, 8)">
        <rect x="0" y="0" width="180" height="34" rx="6" fill="#065f46" stroke="#059669" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#34d399"/>
        <text x="32" y="22" fill="#ecfdf5" font-family="sans-serif" font-size="12" font-weight="600">8 OF 8 TRUCKS ACTIVE</text>
      </g>
    </g>

    <!-- Stat KPI Cards -->
    <g transform="translate(105, 215)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="16" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12">Daily Potable Water Delivered</text>
      <text x="16" y="62" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="700">120,000 L</text>
      <text x="16" y="82" fill="#10b981" font-family="monospace" font-size="11">↑ 100% Target Met</text>

      <!-- Card 2 -->
      <rect x="253" y="0" width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="269" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12">Active Municipal Regions</text>
      <text x="269" y="62" fill="#f3f4f6" font-family="sans-serif" font-size="26" font-weight="700">7 Regions</text>
      <text x="269" y="82" fill="#9184d9" font-family="monospace" font-size="11">Tshwane Metro North/South</text>

      <!-- Card 3 -->
      <rect x="506" y="0" width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="522" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12">Compliance Score</text>
      <text x="522" y="62" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="700">99.4%</text>
      <text x="522" y="82" fill="#10b981" font-family="monospace" font-size="11">SANS 241 Water Quality</text>

      <!-- Card 4 -->
      <rect x="759" y="0" width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
      <text x="775" y="28" fill="#9ca3af" font-family="sans-serif" font-size="12">Contract Duration</text>
      <text x="775" y="62" fill="#f3f4f6" font-family="sans-serif" font-size="26" font-weight="700">36 Months</text>
      <text x="775" y="82" fill="#f59e0b" font-family="monospace" font-size="11">Feb 2025 – Feb 2028</text>
    </g>

    <!-- Lower Table / Schedule Visualization -->
    <g transform="translate(105, 335)">
      <rect x="0" y="0" width="990" height="260" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>

      <!-- Table Header -->
      <rect x="0" y="0" width="990" height="42" rx="12" fill="#1e293b"/>
      <rect x="0" y="26" width="990" height="16" fill="#1e293b"/>
      <line x1="0" y1="42" x2="990" y2="42" stroke="#334155" stroke-width="1"/>

      <text x="24" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">TRUCK ID</text>
      <text x="140" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">CAPACITY</text>
      <text x="260" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">ASSIGNED SETTLEMENT</text>
      <text x="520" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">DAILY ROUNDS</text>
      <text x="720" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">DISPATCH STATUS</text>
      <text x="890" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">TELEMETRY</text>

      <!-- Row 1 -->
      <g transform="translate(0, 43)">
        <rect x="0" y="0" width="990" height="50" fill="#111827" fill-opacity="0.6"/>
        <line x1="0" y1="50" x2="990" y2="50" stroke="#1f2937" stroke-width="1"/>
        <text x="24" y="30" fill="#f9fafb" font-family="monospace" font-size="13" font-weight="600">TANKER-01</text>
        <text x="140" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">15,000 L</text>
        <text x="260" y="30" fill="#e5e7eb" font-family="sans-serif" font-size="13">Region 1 (Mamelodi Ext 6)</text>
        <text x="520" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">4 / 4 Complete</text>
        <rect x="720" y="14" width="90" height="24" rx="4" fill="#065f46"/>
        <text x="765" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">ON ROUTE</text>
        <circle cx="910" cy="25" r="4" fill="#10b981"/>
        <text x="922" y="29" fill="#9ca3af" font-family="monospace" font-size="11">GPS Live</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 94)">
        <rect x="0" y="0" width="990" height="50" fill="#1e293b" fill-opacity="0.3"/>
        <line x1="0" y1="50" x2="990" y2="50" stroke="#1f2937" stroke-width="1"/>
        <text x="24" y="30" fill="#f9fafb" font-family="monospace" font-size="13" font-weight="600">TANKER-02</text>
        <text x="140" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">15,000 L</text>
        <text x="260" y="30" fill="#e5e7eb" font-family="sans-serif" font-size="13">Region 2 (Hammanskraal West)</text>
        <text x="520" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">3 / 4 In Progress</text>
        <rect x="720" y="14" width="90" height="24" rx="4" fill="#0c4a6e"/>
        <text x="765" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">DELIVERING</text>
        <circle cx="910" cy="25" r="4" fill="#10b981"/>
        <text x="922" y="29" fill="#9ca3af" font-family="monospace" font-size="11">GPS Live</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="990" height="50" fill="#111827" fill-opacity="0.6"/>
        <line x1="0" y1="50" x2="990" y2="50" stroke="#1f2937" stroke-width="1"/>
        <text x="24" y="30" fill="#f9fafb" font-family="monospace" font-size="13" font-weight="600">TANKER-03</text>
        <text x="140" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">15,000 L</text>
        <text x="260" y="30" fill="#e5e7eb" font-family="sans-serif" font-size="13">Region 3 (Atteridgeville Informal)</text>
        <text x="520" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">4 / 4 Complete</text>
        <rect x="720" y="14" width="90" height="24" rx="4" fill="#065f46"/>
        <text x="765" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">REFILLING</text>
        <circle cx="910" cy="25" r="4" fill="#10b981"/>
        <text x="922" y="29" fill="#9ca3af" font-family="monospace" font-size="11">GPS Live</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 196)">
        <rect x="0" y="0" width="990" height="50" fill="#1e293b" fill-opacity="0.3"/>
        <text x="24" y="30" fill="#f9fafb" font-family="monospace" font-size="13" font-weight="600">TANKER-04–08</text>
        <text x="140" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">15,000 L ea</text>
        <text x="260" y="30" fill="#e5e7eb" font-family="sans-serif" font-size="13">Regions 4, 5, 6 &amp; 7 (Moot / Olievenhoutbosch / Mabopane)</text>
        <text x="520" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13">Active Dispatch</text>
        <rect x="720" y="14" width="90" height="24" rx="4" fill="#065f46"/>
        <text x="765" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">ON SCHEDULE</text>
        <circle cx="910" cy="25" r="4" fill="#10b981"/>
        <text x="922" y="29" fill="#9ca3af" font-family="monospace" font-size="11">GPS Live</text>
      </g>
    </g>
  </g>
</svg>
