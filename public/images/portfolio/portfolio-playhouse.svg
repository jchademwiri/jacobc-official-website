<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradPlayhouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121324"/>
      <stop offset="50%" stop-color="#1e1b38"/>
      <stop offset="100%" stop-color="#0f101c"/>
    </linearGradient>
    <linearGradient id="playhouseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9184d9"/>
      <stop offset="50%" stop-color="#b4a7f5"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="cardGradPlayhouse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a264a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#19162e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowPlayhouse" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradPlayhouse)"/>
  <circle cx="200" cy="160" r="300" fill="#9184d9" opacity="0.18" filter="blur(60px)"/>
  <circle cx="1000" cy="480" r="320" fill="#7c3aed" opacity="0.14" filter="blur(50px)"/>

  <!-- Browser Frame -->
  <g filter="url(#shadowPlayhouse)">
    <rect x="70" y="40" width="1060" height="595" rx="16" fill="#131322" stroke="#383359" stroke-width="1.5"/>

    <!-- Top Bar -->
    <rect x="70" y="40" width="1060" height="46" rx="16" fill="#201e38"/>
    <rect x="70" y="70" width="1060" height="16" fill="#201e38"/>
    <line x1="70" y1="86" x2="1130" y2="86" stroke="#383359" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="98" cy="63" r="6" fill="#ef4444"/>
    <circle cx="118" cy="63" r="6" fill="#f59e0b"/>
    <circle cx="138" cy="63" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="360" y="51" width="480" height="24" rx="6" fill="#131322" stroke="#383359" stroke-width="1"/>
    <text x="600" y="67" fill="#c4b5fd" font-family="monospace" font-size="11" text-anchor="middle">https://www.playhousemedia.co.za</text>

    <!-- Nav -->
    <g transform="translate(110, 110)">
      <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">PLAYHOUSE <tspan fill="#9184d9">MEDIA GROUP</tspan></text>
      <text x="470" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="13">Brands</text>
      <text x="560" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="13">Ventures</text>
      <text x="660" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="13">About</text>
      <text x="740" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="13">Contact</text>

      <rect x="850" y="2" width="130" height="32" rx="6" fill="url(#playhouseAccent)"/>
      <text x="915" y="22" fill="#161826" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Group Portal →</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(110, 175)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#3b2d6b" stroke="#6d28d9" stroke-width="1"/>
      <text x="110" y="16" fill="#ddd6fe" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">🚀 VENTURE &amp; DIGITAL STUDIO</text>

      <text x="0" y="60" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
        Building Products &amp; Digital Infrastructure
      </text>
      <text x="0" y="96" fill="url(#playhouseAccent)" font-family="sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
        for the Modern African Enterprise.
      </text>
      <text x="0" y="128" fill="#a1a1aa" font-family="sans-serif" font-size="14">
        The parent holding company behind TenderEdge Solutions, Apex Web Solutions, TenderTrack360 and bespoke software delivery.
      </text>
    </g>

    <!-- 3 Brands / Ventures Cards -->
    <g transform="translate(110, 345)">
      <!-- Brand 1 -->
      <rect x="0" y="0" width="300" height="240" rx="12" fill="url(#cardGradPlayhouse)" stroke="#3f3869" stroke-width="1"/>
      <text x="24" y="36" fill="#9184d9" font-family="monospace" font-size="11" font-weight="600">VENTURE 01 / SAAS</text>
      <text x="24" y="68" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">TenderTrack360</text>
      <line x1="24" y1="88" x2="276" y2="88" stroke="#383359" stroke-width="1"/>
      <text x="24" y="116" fill="#c4b5fd" font-family="sans-serif" font-size="12">All-in-one tender management SaaS: automated RFP alerts, compliance matrix, and purchase order tracking.</text>
      <text x="24" y="170" fill="#a78bfa" font-family="monospace" font-size="11">● Active SaaS Platform</text>
      <text x="24" y="195" fill="#a78bfa" font-family="monospace" font-size="11">● Built on Next.js &amp; Supabase</text>

      <!-- Brand 2 -->
      <rect x="340" y="0" width="300" height="240" rx="12" fill="url(#cardGradPlayhouse)" stroke="#3f3869" stroke-width="1"/>
      <text x="364" y="36" fill="#9184d9" font-family="monospace" font-size="11" font-weight="600">VENTURE 02 / WEB</text>
      <text x="364" y="68" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">Apex Web Solutions</text>
      <line x1="364" y1="88" x2="616" y2="88" stroke="#383359" stroke-width="1"/>
      <text x="364" y="116" fill="#c4b5fd" font-family="sans-serif" font-size="12">High-performance web development and hosting subscription packages (R299–R999/mo) for SMEs.</text>
      <text x="364" y="170" fill="#a78bfa" font-family="monospace" font-size="11">● High-Speed Astro Delivery</text>
      <text x="364" y="195" fill="#a78bfa" font-family="monospace" font-size="11">● Tiered Managed Subscriptions</text>

      <!-- Brand 3 -->
      <rect x="680" y="0" width="300" height="240" rx="12" fill="url(#cardGradPlayhouse)" stroke="#3f3869" stroke-width="1"/>
      <text x="704" y="36" fill="#9184d9" font-family="monospace" font-size="11" font-weight="600">VENTURE 03 / ADVISORY</text>
      <text x="704" y="68" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">Tender Edge Solutions</text>
      <line x1="704" y1="88" x2="956" y2="88" stroke="#383359" stroke-width="1"/>
      <text x="704" y="116" fill="#c4b5fd" font-family="sans-serif" font-size="12">Specialist tender compliance, CSD/CIDB registration, and end-to-end bid submission preparation.</text>
      <text x="704" y="170" fill="#a78bfa" font-family="monospace" font-size="11">● Public &amp; Private Tenders</text>
      <text x="704" y="195" fill="#a78bfa" font-family="monospace" font-size="11">● 98%+ Compliance Pass Rate</text>
    </g>
  </g>
</svg>
