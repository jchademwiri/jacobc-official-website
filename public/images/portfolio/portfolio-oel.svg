<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradOel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131e"/>
      <stop offset="50%" stop-color="#102538"/>
      <stop offset="100%" stop-color="#08101a"/>
    </linearGradient>
    <linearGradient id="oelAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGradOel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142c44" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1b2b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowOel" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradOel)"/>
  <circle cx="250" cy="160" r="300" fill="#0284c7" opacity="0.16" filter="blur(60px)"/>
  <circle cx="950" cy="500" r="280" fill="#0ea5e9" opacity="0.12" filter="blur(50px)"/>

  <!-- Browser Frame -->
  <g filter="url(#shadowOel)">
    <rect x="70" y="40" width="1060" height="595" rx="16" fill="#0c1824" stroke="#1e3a5f" stroke-width="1.5"/>

    <!-- Top Bar -->
    <rect x="70" y="40" width="1060" height="46" rx="16" fill="#15273b"/>
    <rect x="70" y="70" width="1060" height="16" fill="#15273b"/>
    <line x1="70" y1="86" x2="1130" y2="86" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="98" cy="63" r="6" fill="#ef4444"/>
    <circle cx="118" cy="63" r="6" fill="#f59e0b"/>
    <circle cx="138" cy="63" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="360" y="51" width="480" height="24" rx="6" fill="#0b1622" stroke="#1e3a5f" stroke-width="1"/>
    <text x="600" y="67" fill="#7dd3fc" font-family="monospace" font-size="11" text-anchor="middle">https://www.oelglobalservices.com</text>

    <!-- Nav -->
    <g transform="translate(110, 110)">
      <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="1">OEL <tspan fill="#38bdf8">GLOBAL</tspan></text>
      <text x="440" y="22" fill="#93c5fd" font-family="sans-serif" font-size="13">Remote Staffing</text>
      <text x="570" y="22" fill="#93c5fd" font-family="sans-serif" font-size="13">Procurement</text>
      <text x="680" y="22" fill="#93c5fd" font-family="sans-serif" font-size="13">Oil &amp; Gas</text>
      <text x="770" y="22" fill="#93c5fd" font-family="sans-serif" font-size="13">Mining</text>

      <rect x="850" y="2" width="130" height="32" rx="6" fill="url(#oelAccent)"/>
      <text x="915" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Client Portal →</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(110, 175)">
      <rect x="0" y="0" width="260" height="24" rx="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text x="130" y="16" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">GLOBAL WORKFORCE &amp; SUPPLY CHAIN</text>

      <text x="0" y="60" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
        International Remote Staffing &amp; Industrial
      </text>
      <text x="0" y="96" fill="url(#oelAccent)" font-family="sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
        Procurement for Energy &amp; Mining.
      </text>
      <text x="0" y="128" fill="#94a3b8" font-family="sans-serif" font-size="14">
        Connecting vetted technical talent and mission-critical engineering supplies across Africa, the UK and North America.
      </text>
    </g>

    <!-- 3 Core Service Divisions -->
    <g transform="translate(110, 345)">
      <!-- Division 1 -->
      <rect x="0" y="0" width="300" height="240" rx="12" fill="url(#cardGradOel)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="36" cy="36" r="16" fill="#0369a1"/>
      <text x="36" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text>
      <text x="64" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Remote &amp; Tech Staffing</text>
      <line x1="20" y1="68" x2="280" y2="68" stroke="#1e3a5f" stroke-width="1"/>
      <text x="20" y="96" fill="#cbd5e1" font-family="sans-serif" font-size="12">Pre-vetted engineering estimators, CAD drafters, virtual assistants and project controllers deployed in 48 hours.</text>
      <text x="20" y="146" fill="#38bdf8" font-family="monospace" font-size="11">✓ Multi-timezone support (GMT / CAT / EST)</text>
      <text x="20" y="170" fill="#38bdf8" font-family="monospace" font-size="11">✓ Up to 60% operational payroll savings</text>

      <!-- Division 2 -->
      <rect x="340" y="0" width="300" height="240" rx="12" fill="url(#cardGradOel)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="376" cy="36" r="16" fill="#0369a1"/>
      <text x="376" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text>
      <text x="404" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Industrial Procurement</text>
      <line x1="360" y1="68" x2="620" y2="68" stroke="#1e3a5f" stroke-width="1"/>
      <text x="360" y="96" fill="#cbd5e1" font-family="sans-serif" font-size="12">End-to-end sourcing, quality verification and customs clearance for high-spec mechanical and electrical plant components.</text>
      <text x="360" y="146" fill="#38bdf8" font-family="monospace" font-size="11">✓ OEM certified supply chain partners</text>
      <text x="360" y="170" fill="#38bdf8" font-family="monospace" font-size="11">✓ Expedited air &amp; sea freight routing</text>

      <!-- Division 3 -->
      <rect x="680" y="0" width="300" height="240" rx="12" fill="url(#cardGradOel)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="716" cy="36" r="16" fill="#0369a1"/>
      <text x="716" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text>
      <text x="744" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Sector Specialization</text>
      <line x1="700" y1="68" x2="960" y2="68" stroke="#1e3a5f" stroke-width="1"/>
      <text x="700" y="96" fill="#cbd5e1" font-family="sans-serif" font-size="12">Specialized sector expertise tailored to upstream oil &amp; gas offshore platforms, surface mining, and energy utilities.</text>
      <text x="700" y="146" fill="#38bdf8" font-family="monospace" font-size="11">✓ Full ISO &amp; OSHA safety compliance</text>
      <text x="700" y="170" fill="#38bdf8" font-family="monospace" font-size="11">✓ Africa, UK &amp; North America coverage</text>
    </g>
  </g>
</svg>
