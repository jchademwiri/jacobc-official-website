<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Brand Cyan-to-Violet IMS Gradient -->
    <linearGradient id="logo-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#9184d9" />
      <stop offset="100%" stop-color="#7c68d6" />
    </linearGradient>

    <!-- Executive Platinum-to-Violet J Gradient -->
    <linearGradient id="logo-j-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e9e9ed" />
      <stop offset="100%" stop-color="#9184d9" />
    </linearGradient>

    <!-- Subtle Optical Luminous Glow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .jc-name {
      font-family: "Inter Variable", "Inter", -apple-system, sans-serif;
      font-size: 27px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.3px;
    }
    .jc-title {
      font-family: "IBM Plex Mono", monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #9184d9;
      letter-spacing: 1.5px;
    }
    .jc-pill-text {
      font-family: "IBM Plex Mono", monospace;
      font-size: 8.5px;
      font-weight: 500;
    }
  </style>

  <!-- ICON MARK: 100x100 Squircle -->
  <g transform="translate(10, 10)">
    <!-- Dark Obsidian Squircle Base -->
    <rect width="100" height="100" rx="26" fill="#141522" stroke="#26293d" stroke-width="1.5" />

    <!-- ISO Standards Compliance & Orbit Ring -->
    <circle cx="50" cy="50" r="39" stroke="#252840" stroke-width="1.2" stroke-dasharray="3 3" />

    <!-- Subtle Dynamic Orbit Arc -->
    <path d="M22 34 C30 22 42 18 52 18 C72 18 86 28 88 46" 
          stroke="url(#logo-c-grad)" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          opacity="0.3" />

    <!-- Letter 'J': Confident vertical stem with anchored bottom hook -->
    <path d="M35 24 L35 65 A 10.5 10.5 0 0 1 14 65" 
          stroke="url(#logo-j-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter 'C': Precision geometric crescent embracing the right quadrant -->
    <path d="M85 34 C74 21 49 26 49 50 C49 74 74 79 85 66" 
          stroke="url(#logo-c-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logo-glow)" />

    <!-- Tripartite ISO Integrated Management System Nodes -->
    <!-- ISO 9001 Quality Standard Node (Electric Violet) -->
    <circle cx="85" cy="34" r="4.5" fill="#9184d9" stroke="#141522" stroke-width="2" />

    <!-- ISO 14001 Environmental Standard Node (Sky Cyan) -->
    <circle cx="85" cy="66" r="4.5" fill="#38bdf8" stroke="#141522" stroke-width="2" />

    <!-- ISO 45001 Health & Safety Standard Node (Amber Gold) -->
    <circle cx="14" cy="65" r="4" fill="#f59e0b" stroke="#141522" stroke-width="2" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(128, 38)">
    <!-- Primary Identity -->
    <text class="jc-name" x="0" y="22">Jacob Chademwiri</text>

    <!-- Subtitle / Multi-disciplinary Role -->
    <text class="jc-title" x="1" y="42">TENDER MANAGEMENT · ISO IMS LEAD · AR · WEB DEV</text>

    <!-- Capability Badges Strip -->
    <g transform="translate(1, 50)">
      <!-- ISO 9001 Pill -->
      <rect width="64" height="17" rx="3.5" fill="#1b1d2c" stroke="#2e324a" stroke-width="0.75" />
      <text class="jc-pill-text" x="32" y="11.5" text-anchor="middle" fill="#e9e9ed">ISO 9001</text>

      <!-- ISO 14001 Pill -->
      <rect x="70" width="70" height="17" rx="3.5" fill="#1b1d2c" stroke="#2e324a" stroke-width="0.75" />
      <text class="jc-pill-text" x="105" y="11.5" text-anchor="middle" fill="#38bdf8">ISO 14001</text>

      <!-- ISO 45001 Pill -->
      <rect x="146" width="70" height="17" rx="3.5" fill="#1b1d2c" stroke="#2e324a" stroke-width="0.75" />
      <text class="jc-pill-text" x="181" y="11.5" text-anchor="middle" fill="#f59e0b">ISO 45001</text>

      <!-- SAP ERP Pill -->
      <rect x="222" width="62" height="17" rx="3.5" fill="#1b1d2c" stroke="#32386e" stroke-width="0.75" />
      <text class="jc-pill-text" x="253" y="11.5" text-anchor="middle" fill="#9184d9">SAP·ERP</text>

      <!-- ASTRO DEV Pill -->
      <rect x="290" width="68" height="17" rx="3.5" fill="#1b1d2c" stroke="#2e324a" stroke-width="0.75" />
      <text class="jc-pill-text" x="324" y="11.5" text-anchor="middle" fill="#bbbbc1">WEB·DEV</text>
    </g>
  </g>
</svg>
