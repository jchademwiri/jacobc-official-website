<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Continuous IMS Cyan-to-Violet Loop Gradient -->
    <linearGradient id="ic2-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#9184d9" />
      <stop offset="100%" stop-color="#7c68d6" />
    </linearGradient>

    <!-- Executive Platinum-to-Violet J Gradient -->
    <linearGradient id="ic2-j-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e9e9ed" />
      <stop offset="100%" stop-color="#9184d9" />
    </linearGradient>

    <!-- Subtle Luminous Bloom Glow -->
    <filter id="ic2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Backplate -->
  <rect width="100" height="100" rx="28" fill="#161826" stroke="#2b2d3d" stroke-width="1.5" />

  <!-- Continuous IMS Orbit Ring (Background Trajectory) -->
  <ellipse cx="50" cy="50" rx="38" ry="34" stroke="#262a60" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Luminous Ambient Orbit Arc (Continuous IMS Flow) -->
  <path d="M24 32 C31 22 42 18 54 18 C72 18 86 28 88 46" 
        stroke="url(#ic2-c-grad)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.35" />

  <!-- 'J' Monogram: Confident vertical stem with anchored curve -->
  <path d="M40 24 L40 58 C40 68 33 75 23 75 C17 75 14 70 14 65" 
        stroke="url(#ic2-j-grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'C' Monogram: Bold continuous arc embracing the right orbit -->
  <path d="M84 34 C71 20 54 24 54 50 C54 76 71 80 84 66" 
        stroke="url(#ic2-c-grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ic2-glow)" />

  <!-- 3 ISO Satellite Standard Nodes (Integrated Management System) -->
  <!-- ISO 9001 Quality Node (Violet) -->
  <circle cx="84" cy="34" r="4.5" fill="#9184d9" stroke="#161826" stroke-width="2" />
  
  <!-- ISO 14001 Environmental Node (Cyan) -->
  <circle cx="84" cy="66" r="4.5" fill="#38bdf8" stroke="#161826" stroke-width="2" />

  <!-- ISO 45001 Health & Safety Node (Gold/Amber) -->
  <circle cx="14" cy="65" r="4" fill="#f59e0b" stroke="#161826" stroke-width="2" />
</svg>
