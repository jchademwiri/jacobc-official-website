<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="c3-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4a7f5" />
      <stop offset="100%" stop-color="#9184d9" />
    </linearGradient>
    <linearGradient id="c3-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232532" />
      <stop offset="100%" stop-color="#161826" />
    </linearGradient>
  </defs>

  <style>
    .c3-title {
      font-family: "Inter Variable", "Inter", -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #e9e9ed;
      letter-spacing: -1px;
    }
    .c3-title-dot {
      fill: #9184d9;
    }
    .c3-meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      font-weight: 500;
      fill: #bbbbc1;
      letter-spacing: 2.5px;
    }
    .c3-submeta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      fill: #909199;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- MARK: Bold Architectural Monogram (J + C Bracket) -->
  <g transform="translate(14, 10)">
    <!-- Base Beveled Container -->
    <rect width="100" height="100" rx="18" fill="url(#c3-card-grad)" stroke="#3f424d" stroke-width="1.5" />

    <!-- Corner Alignment Marks (Technical/Architectural blueprint feel) -->
    <path d="M12 24 L12 12 L24 12" stroke="#9184d9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M88 76 L88 88 L76 88" stroke="#9184d9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Outer 'C' Architecture: Heavy geometric clamp/bracket -->
    <path d="M72 30 L44 30 C34 30 28 36 28 46 L28 54 C28 64 34 70 44 70 L72 70" 
          stroke="#e9e9ed" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Inner 'J' Monogram: Interlocking descending pillar with curved terminal -->
    <path d="M54 26 L54 62 C54 71 47 74 41 74 C36 74 33 72 31 69" 
          stroke="url(#c3-accent-grad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Top Right Precision Diamond (Standardization Milestone) -->
    <polygon points="76,22 84,30 76,38 68,30" fill="#9184d9" />
    <circle cx="76" cy="30" r="2" fill="#161826" />
  </g>

  <!-- TYPOGRAPHY: High-Contrast Modernist Lockup -->
  <g transform="translate(136, 44)">
    <text class="c3-title" x="0" y="20">
      JACOB C<tspan class="c3-title-dot">.</tspan>
    </text>

    <!-- Subtitle: Professional Disciplines -->
    <text class="c3-meta" x="2" y="42">
      TENDERS · ISO IMS · AR · WEB
    </text>

    <!-- System Specs Footnote -->
    <text class="c3-submeta" x="2" y="58">
      CENTURION, GP · ISO 9001 · 14001 · 45001 · SAP
    </text>
  </g>
</svg>
