<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Brand Cyan-to-Violet IMS Gradient -->
    <linearGradient id="fav-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#9184d9" />
      <stop offset="100%" stop-color="#7c68d6" />
    </linearGradient>

    <!-- Executive Platinum-to-Violet J Gradient -->
    <linearGradient id="fav-j-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e9e9ed" />
      <stop offset="100%" stop-color="#9184d9" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Squircle Base -->
  <rect width="128" height="128" rx="34" fill="#141522" stroke="#26293d" stroke-width="2" />

  <!-- ISO Standards Compliance & Orbit Ring -->
  <circle cx="64" cy="64" r="50" stroke="#252840" stroke-width="1.8" stroke-dasharray="4 4" />

  <!-- Dynamic Orbit Flare -->
  <path d="M28 44 C38 28 54 23 66 23 C92 23 110 36 113 59" 
        stroke="url(#fav-c-grad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.35" />

  <!-- Letter 'J': Confident vertical stem with anchored bottom hook -->
  <path d="M45 31 L45 83 A 13.5 13.5 0 0 1 18 83" 
        stroke="url(#fav-j-grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Letter 'C': Precision geometric crescent embracing the right quadrant -->
  <path d="M109 44 C95 27 63 33 63 64 C63 95 95 101 109 84" 
        stroke="url(#fav-c-grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Tripartite ISO Integrated Management System Nodes -->
  <!-- ISO 9001 Quality Standard Node (Electric Violet) -->
  <circle cx="109" cy="44" r="6" fill="#9184d9" stroke="#141522" stroke-width="2.5" />

  <!-- ISO 14001 Environmental Standard Node (Sky Cyan) -->
  <circle cx="109" cy="84" r="6" fill="#38bdf8" stroke="#141522" stroke-width="2.5" />

  <!-- ISO 45001 Health & Safety Standard Node (Amber Gold) -->
  <circle cx="18" cy="83" r="5.5" fill="#f59e0b" stroke="#141522" stroke-width="2.5" />
</svg>
