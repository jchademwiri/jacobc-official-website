<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Continuous IMS Cyan-to-Violet Loop Gradient -->
    <linearGradient id="fav-loop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#9184d9" />
      <stop offset="100%" stop-color="#7c68d6" />
    </linearGradient>

    <!-- Executive Platinum-to-Violet J Gradient -->
    <linearGradient id="fav-j-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e9e9ed" />
      <stop offset="100%" stop-color="#9184d9" />
    </linearGradient>
  </defs>

  <!-- Dark Tech Squircle -->
  <rect width="128" height="128" rx="36" fill="#161826" stroke="#2b2d3d" stroke-width="2" />

  <!-- Continuous IMS Orbit Ring -->
  <ellipse cx="64" cy="64" rx="49" ry="44" stroke="#262a60" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Ambient Luminous Orbit Flare -->
  <path d="M31 41 C40 28 54 23 69 23 C92 23 110 36 113 59" 
        stroke="url(#fav-loop-grad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.35" />

  <!-- 'J' Monogram: Confident vertical stem with anchored curve -->
  <path d="M51 31 L51 74 C51 87 42 96 29 96 C22 96 18 90 18 83" 
        stroke="url(#fav-j-grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'C' Monogram: Bold continuous arc embracing the right orbit -->
  <path d="M108 44 C91 26 69 31 69 64 C69 97 91 102 108 84" 
        stroke="url(#fav-loop-grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 3 ISO Satellite Standard Nodes -->
  <!-- ISO 9001 Quality Node (Violet) -->
  <circle cx="108" cy="44" r="5.5" fill="#9184d9" stroke="#161826" stroke-width="2.5" />

  <!-- ISO 14001 Environmental Node (Cyan) -->
  <circle cx="108" cy="84" r="5.5" fill="#38bdf8" stroke="#161826" stroke-width="2.5" />

  <!-- ISO 45001 Health & Safety Node (Gold/Amber) -->
  <circle cx="18" cy="83" r="5" fill="#f59e0b" stroke="#161826" stroke-width="2.5" />
</svg>
