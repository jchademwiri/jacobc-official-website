<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Brushed Warm Bronze Gradient -->
    <linearGradient id="fav-bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b685" />
      <stop offset="50%" stop-color="#c4a472" />
      <stop offset="100%" stop-color="#8a6b3f" />
    </linearGradient>

    <!-- Warm Ivory-to-Stone Gradient -->
    <linearGradient id="fav-ivory-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf8f4" />
      <stop offset="65%" stop-color="#e8e4dc" />
      <stop offset="100%" stop-color="#c4a472" />
    </linearGradient>
  </defs>

  <!-- Executive Charcoal Squircle Base -->
  <rect width="128" height="128" rx="34" fill="#1c1c1c" stroke="#38352f" stroke-width="2" />

  <!-- Subtle Inner Hairline Ring -->
  <circle cx="64" cy="64" r="50" stroke="#2e2c27" stroke-width="1.8" stroke-dasharray="4 4" />

  <!-- Warm Bronze Accent Arc -->
  <path
    d="M28 44 C38 28 54 23 66 23 C92 23 110 36 113 59"
    stroke="url(#fav-bronze-grad)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Letter 'J' -->
  <path
    d="M45 31 L45 83 A 13.5 13.5 0 0 1 18 83"
    stroke="url(#fav-ivory-grad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter 'C' -->
  <path
    d="M109 44 C95 27 63 33 63 64 C63 95 95 101 109 84"
    stroke="url(#fav-bronze-grad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Executive Bronze & Ivory Precision Nodes -->
  <circle cx="109" cy="44" r="5.5" fill="#d4b685" stroke="#1c1c1c" stroke-width="2.5" />
  <circle cx="109" cy="84" r="5.5" fill="#9a7b4f" stroke="#1c1c1c" stroke-width="2.5" />
  <circle cx="18" cy="83" r="5.5" fill="#f2efe9" stroke="#1c1c1c" stroke-width="2.5" />
</svg>
